name: aule-quality

services:
  runner:
    image: aule-quality:20261117
    container_name: aule-quality
    init: true
    restart: unless-stopped
    user: '1001:1001'
    environment:
      RUNNER_REGISTRATION_TOKEN: ${RUNNER_REGISTRATION_TOKEN:-}
    cpus: 4
    mem_limit: 6g
    memswap_limit: 6g
    pids_limit: 512
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
