# Capricorn's server, next to a LiveKit server you already run: the platform
# and its worker, their database, a local embedding model, the voice tutor and
# the playground. Settings come from one env file (see .env.example):
#
#   CAPRICORN_ENV_FILE=/etc/capricorn/capricorn.env docker compose up -d --build
#   docker compose exec embeddings ollama pull bge-m3      # once
#
# These are read from the shell (or a file given with --env-file), not from
# the env file above:
#
#   CAPRICORN_DB_PORT, CAPRICORN_EMBEDDINGS_PORT   loopback ports, if 5433 or 11435 are taken
#   CAPRICORN_FCM_KEY_FILE                         the Firebase service account key, for pushes
#   CAPRICORN_UID, CAPRICORN_GID                   who the platform runs as, to read that key
#
# The services of this repository use the host network (Linux) and listen on
# loopback only: put your reverse proxy in front of the playground. The
# database and the embedding model are published on loopback ports.
x-service: &service
  env_file:
    - ${CAPRICORN_ENV_FILE:-.env}
  network_mode: host
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# The platform and its worker read the Firebase key for push notifications
# from CAPRICORN_FCM_KEY_FILE on this machine, and run as CAPRICORN_UID so they
# can read it when it belongs to the account that runs the server.
x-platform: &platform
  user: "${CAPRICORN_UID:-10001}:${CAPRICORN_GID:-10001}"
  volumes:
    - ${CAPRICORN_FCM_KEY_FILE:-/dev/null}:/run/secrets/firebase.json:ro

services:
  agent:
    <<: *service
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    mem_limit: 2g

  postgres:
    image: pgvector/pgvector:pg17
    env_file:
      - ${CAPRICORN_ENV_FILE:-.env}
    ports:
      - "127.0.0.1:${CAPRICORN_DB_PORT:-5433}:5432"
    volumes:
      - capricorn-db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Embeddings for the children's memories, computed on this machine.
  embeddings:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:${CAPRICORN_EMBEDDINGS_PORT:-11435}:11434"
    volumes:
      - capricorn-models:/root/.ollama
    restart: unless-stopped
    mem_limit: 3g

  platform:
    <<: [*service, *platform]
    build:
      context: .
      dockerfile: apps/platform/Dockerfile
    command: ["serve"]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m

  worker:
    <<: [*service, *platform]
    build:
      context: .
      dockerfile: apps/platform/Dockerfile
    command: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m

  playground:
    <<: *service
    build:
      context: .
      dockerfile: apps/playground/Dockerfile
    mem_limit: 256m
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO /dev/null "http://127.0.0.1:$${PLAYGROUND_PORT:-8090}$${PLAYGROUND_BASE_PATH-/playground}/healthz"
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  capricorn-db:
  capricorn-models:
