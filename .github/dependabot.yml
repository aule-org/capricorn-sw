version: 2
updates:
  - package-ecosystem: cargo
    directory: /apps/platform
    schedule:
      interval: weekly
    groups:
      compatible:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /apps/agent
    schedule:
      interval: weekly
    groups:
      compatible:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      compatible:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: docker
    directories:
      - /apps/agent
      - /apps/platform
      - /apps/playground
      - /infra/runner
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
