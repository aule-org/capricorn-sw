[project]
name = "capricorn-agent"
version = "0.0.0"
description = "Capricorn's voice tutor, a LiveKit Agents worker"
requires-python = ">=3.13"
license = "Apache-2.0"
dependencies = [
    "jsonschema[format]>=4.23",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capricorn_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
