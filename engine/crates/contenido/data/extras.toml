[[tareas.ejercicios]]
id = "tar-1"
nivel = 3
angulo = "calculo"
enunciado = "Resuelve en tu cuaderno: 5/9 + 2/9."
respuesta = "7/9"
verificar = "5/9 + 2/9"
tiempo_s = 60
pistas = ["¿Los dos denominadores son iguales?", "Si juntas 5 novenos y 2 novenos, ¿cuántos novenos tienes?"]
pista_grafica = { texto = "Una barra en novenos: 5 partes y luego 2 partes más.", grafico = { tipo = "barras", filas = [{ partes = 9, sombreadas = 5, etiqueta = "5/9" }, { partes = 9, sombreadas = 2, etiqueta = "2/9" }] } }
[tareas.ejercicios.similar]
enunciado = "Resuelve: 3/8 + 4/8."
pasos = ["Los denominadores son iguales: octavos.", "Sumo los numeradores: 3 + 4 = 7.", "El resultado es 7/8."]
respuesta = "7/8"
verificar = "3/8 + 4/8"

[[tareas.ejercicios]]
id = "tar-2"
nivel = 3
angulo = "calculo"
enunciado = "Resuelve en tu cuaderno: escribe 11/4 como número mixto."
respuesta = "2 3/4"
forma = "mixto"
verificar = "11/4"
tiempo_s = 90
pistas = ["¿Cuántos cuartos necesitas para formar 1 entero?", "¿Cuántas veces cabe 4 en 11 y cuánto sobra?"]
pista_grafica = { texto = "11 cuartos repartidos en círculos de 4 partes.", grafico = { tipo = "circulos", partes = 4, sombreadas = 11 } }
[tareas.ejercicios.similar]
enunciado = "Escribe 7/3 como número mixto."
pasos = ["Cada entero tiene 3 tercios.", "7 ÷ 3 = 2 y sobra 1.", "Entonces 7/3 = 2 1/3."]
respuesta = "2 1/3"
verificar = "7/3"

[[tareas.ejercicios]]
id = "tar-3"
nivel = 4
angulo = "calculo"
enunciado = "Resuelve en tu cuaderno: 1/2 + 1/3."
respuesta = "5/6"
verificar = "1/2 + 1/3"
tiempo_s = 120
pistas = ["¿Puedes sumar medios y tercios directamente, o primero necesitas un denominador común?", "¿Cuántos sextos es 1/2? ¿Y cuántos sextos es 1/3?"]
pista_grafica = { texto = "Pasa las dos fracciones a sextos.", grafico = { tipo = "barras", filas = [{ partes = 2, sombreadas = 1, etiqueta = "1/2" }, { partes = 6, sombreadas = 3, etiqueta = "3/6" }, { partes = 3, sombreadas = 1, etiqueta = "1/3" }, { partes = 6, sombreadas = 2, etiqueta = "2/6" }] } }
[tareas.ejercicios.similar]
enunciado = "Resuelve: 1/4 + 1/3."
pasos = ["Denominador común: 12.", "1/4 = 3/12 y 1/3 = 4/12.", "3/12 + 4/12 = 7/12."]
respuesta = "7/12"
verificar = "1/4 + 1/3"

[[tareas.ejercicios]]
id = "tar-4"
nivel = 4
angulo = "calculo"
enunciado = "Resuelve en tu cuaderno y simplifica el resultado: 3/4 − 1/12."
respuesta = "2/3"
forma = "simplificada"
verificar = "3/4 - 1/12"
tiempo_s = 150
pistas = ["¿Cuántos doceavos es 3/4?", "Cuando tengas el resultado, ¿hay algún número que divida al numerador y al denominador?"]
pista_grafica = { texto = "3/4 es lo mismo que 9/12. Quita 1/12.", grafico = { tipo = "barras", filas = [{ partes = 4, sombreadas = 3, etiqueta = "3/4" }, { partes = 12, sombreadas = 9, etiqueta = "9/12" }, { partes = 12, sombreadas = 8, etiqueta = "9/12 − 1/12" }] } }
[tareas.ejercicios.similar]
enunciado = "Resuelve y simplifica: 5/6 − 1/3."
pasos = ["1/3 = 2/6.", "5/6 − 2/6 = 3/6.", "Simplifico dividiendo entre 3: 3/6 = 1/2."]
respuesta = "1/2"
verificar = "5/6 - 1/3"

[[tareas.ejercicios]]
id = "tar-5"
nivel = 4
angulo = "contexto"
enunciado = "Resuelve en tu cuaderno: Rosa caminó 1/4 de kilómetro en la mañana y 2/3 de kilómetro en la tarde. ¿Cuánto caminó en total?"
contextos = { futbol = "Resuelve en tu cuaderno: en el entrenamiento de fútbol, Paolo corrió 1/4 de kilómetro calentando y 2/3 de kilómetro en el partido. ¿Cuánto corrió en total?", videojuegos = "Resuelve en tu cuaderno: en tu videojuego llenaste 1/4 de la barra de energía en la primera misión y 2/3 en la segunda. ¿Qué parte de la barra llenaste en total?", dinosaurios = "Resuelve en tu cuaderno: un equipo de paleontólogos excavó 1/4 de hectárea en la mañana y 2/3 de hectárea en la tarde buscando huesos de dinosaurio. ¿Cuánto excavó en total?", cocina = "Resuelve en tu cuaderno: para un keke usaste 1/4 de kilo de harina y 2/3 de kilo de azúcar. ¿Cuántos kilos usaste en total?", musica = "Resuelve en tu cuaderno: ensayaste la guitarra 1/4 de hora y el cajón 2/3 de hora. ¿Cuánto tiempo ensayaste en total?" }
respuesta = "11/12"
verificar = "1/4 + 2/3"
tiempo_s = 150
pistas = ["¿Qué denominador común sirve para cuartos y tercios?", "¿Cuántos doceavos es 1/4 y cuántos es 2/3?"]
pista_grafica = { texto = "Pasa todo a doceavos: 1/4 = 3/12 y 2/3 = 8/12.", grafico = { tipo = "barras", filas = [{ partes = 12, sombreadas = 3, etiqueta = "mañana 3/12" }, { partes = 12, sombreadas = 8, etiqueta = "tarde 8/12" }] } }
[tareas.ejercicios.similar]
enunciado = "Pedro tomó 1/2 litro de agua en la mañana y 1/5 de litro en la tarde. ¿Cuánto tomó en total?"
pasos = ["Denominador común: 10.", "1/2 = 5/10 y 1/5 = 2/10.", "5/10 + 2/10 = 7/10 de litro."]
respuesta = "7/10"
verificar = "1/2 + 1/5"

